name: Python CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Package
        run: |
          pip install -e .

      - name: Install Test Dependencies
        run: |
          pip install pytest

      - name: Verify Import
        run: |
          python -c "import astersurge; print(astersurge.__version__)"

      - name: Run Tests
        run: |
          pytest
