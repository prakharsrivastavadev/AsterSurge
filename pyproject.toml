[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astersurge"
version = "0.3.0"
description = "Open-source AI infrastructure for building intelligent software."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Prakhar Srivastava" }
]
requires-python = ">=3.10"

dependencies = [
    "groq>=0.31.0",
    "openai>=1.99.0",
    "google-generativeai>=0.8.5",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "pydantic>=2.11.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "click>=8.1.8",
    "rich>=14.1.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "tiktoken>=0.9.0",
]

keywords = [
    "ai",
    "llm",
    "agents",
    "automation",
    "framework",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/prakharsrivastavadev/AsterSurge"
Repository = "https://github.com/prakharsrivastavadev/AsterSurge"
Issues = "https://github.com/prakharsrivastavadev/AsterSurge/issues"

[project.scripts]
astersurge = "astersurge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
